name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run pytest suite
        run: >
          python -m pytest
          tests/test_inference_runtime.py
          tests/test_inference_backend_failures.py
          tests/test_smoke.py
          tests/test_local_executor_architect_runtime.py
          tests/test_persistence.py
          tests/test_failure_modes.py
          tests/test_attempt_lineage.py
          tests/test_step_record_spec.py
          tests/test_step_record_persistence.py
          -q
          -p no:cacheprovider
