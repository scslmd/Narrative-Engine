[pytest]
pythonpath = .
addopts = -ra
testpaths = tests
markers =
    integration: tests that require TestClient, build_app(), or full service layer (deselect with '-m "not integration"')

# Parallel execution (opt-in):
#   pytest -n auto --dist=loadfile --basetemp=.tmp_xdist
# Known limitation: test_audit_logging.py shares a log file and may fail
# under parallelism. Run sequentially for those tests:
#   pytest tests/test_audit_logging.py -n 0
