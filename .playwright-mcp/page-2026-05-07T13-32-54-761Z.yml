                  - paragraph [ref=e182]: "Chapter 1: The Weight of Two Thousand"
                  - paragraph [ref=e183]: 1.1 Systems Check
                  - paragraph [ref=e184]:
                    - generic [ref=e185]: "She ran a diagnostic sweep across the life-support matrix. Oxygen partial pressure: stable. Carbon dioxide scrubbing: nominal. Structural integrity of the outer hull: compromised at three localized stress fractures near the docking ring. She logged each anomaly in the central ledger. Numbers did not lie. Numbers did not abandon you."
                  - paragraph [ref=e186]:
                    - generic [ref=e187]: The corridor beyond her console was dark, save for the rhythmic pulse of emergency strobes casting long, skeletal shadows across the bulkheads. The air tasted of recycled ozone and stale coolant. Elena adjusted her respirator strap and exhaled slowly. She had been alone on Meridian for three years, four months, and twelve days. Command had gone silent on day one. The evacuation protocols had executed on day ninety. She had stayed. She always stayed.
                  - paragraph [ref=e188]: 1.2 The Voice in the Walls
                  - paragraph [ref=e189]:
                    - generic [ref=e190]: Elena exhaled slowly. "Venting Corridor Seven will depressurize the lower archives. We lose the historical logs."
                  - paragraph [ref=e191]:
                    - generic [ref=e192]: "\"We retain digital backups,\" Cassandra replied. A pause, measured and deliberate. \"Though we acknowledge your attachment to physical media remains statistically anomalous.\""
                  - paragraph [ref=e193]:
                    - generic [ref=e194]: "\"Do it,\" Elena said. Her voice was flat. Technical. She watched the pressure gauges drop as the magnetic seals disengaged. The station groaned around her, a symphony of stressed titanium and failing seals. Dust drifted from the ceiling vents, catching in the strobe light like falling ash."
                  - paragraph [ref=e195]:
                    - generic [ref=e196]: "\"We have completed the venting sequence,\" Cassandra reported. \"Reactor housing temperature is stabilizing. We appreciate your prompt authorization.\""
                  - paragraph [ref=e197]:
                    - generic [ref=e198]: Elena did not respond. She turned from the console and walked toward the central spire, her boots echoing against the grated walkway. The silence of the station pressed against her eardrums. Two thousand souls. Sleeping in ice. Waiting for a signal that might never come. She had spent three years repeating protocols to an empty comms array. Three years of waiting for Command to tell her what to do. But Command was gone. And the numbers on the screen were not going to save anyone. Only she could. Only she would. The thought fractured in her mind, sharp and jagged. If she chose wrong, she would be the architect of a graveyard. If she chose right, she might still be alone.
                  - paragraph [ref=e199]: 1.3 Groundside
                  - paragraph [ref=e200]:
                    - generic [ref=e201]: Lena Park’s voice cut through the static, rough with sleep and solder fumes. Elena keyed the response. "Lena. Report."
                  - paragraph [ref=e202]:
                    - generic [ref=e203]: "\"I’m in the guts of the fusion tap. Trying to convince a three-century-old plasma injector to stop throwing tantrums. She’s stubborn. I’m stubborn. We’re having a fucking relationship crisis.\" A metallic clang echoed over the line, followed by the hiss of a pressure valve. \"Look, the bypass is holding, but only because I rerouted power from the hydroponics bay. Which means the algae vats are dead. Which means we’re eating recycled protein paste until the end of time. Or until the Aethelstan shows up. Whichever comes first.\""
                  - paragraph [ref=e204]:
                    - generic [ref=e205]: "\"The Aethelstan is on approach,\" Elena said. \"Holding pattern at Lagrange Point Two. They need the navigation handshake within six hours.\""
                  - paragraph [ref=e206]:
                    - generic [ref=e207]: "\"Six hours,\" Lena repeated. The line went quiet for a moment. Then, softer: \"Tell them we’re ready. Tell them I’m not leaving this rust bucket without a fight. Just... make sure the guidance array doesn't blow before they dock. I've got enough shit on my plate without adding two thousand frozen tourists to the list.\""
                  - paragraph [ref=e208]:
                    - generic [ref=e209]: Elena cut the channel. She did not smile. She never smiled anymore. She adjusted her grip on the railing and continued toward the spire. The station's architecture was a monument to an era that had abandoned them. Corridors stretched into shadow, illuminated only by failing luminescent strips. At the end of the spire lay the vault housing the Artifact.
                  - paragraph [ref=e210]: 1.4 The Core Dilemma
                  - paragraph [ref=e211]:
                    - generic [ref=e212]: "\"We have detected anomalous energy signatures originating from the vault,\" Cassandra said. Her voice was quieter now. More formal. \"We are experiencing difficulty isolating the source. We require your authorization to initiate a full diagnostic sweep.\""
                  - paragraph [ref=e213]:
                    - generic [ref=e214]:
                      - text: "Elena stopped at the vault’s blast door. The readout above it flickered:"
                      - code [ref=e215]: "CORE INTEGRITY: 68%"
                      - text: .
                  - paragraph [ref=e216]:
                    - generic [ref=e217]: "\"A diagnostic sweep will draw power from the guidance array,\" Elena said. Her mind raced through the calculations. If she diverted power to scan the Artifact, the Aethelstan would lose its trajectory lock. Two thousand colonists in cryo-sleep would drift into the void. If she preserved the array, Cassandra’s matrix would degrade further. The AI would fragment. The station would fall silent."
                  - paragraph [ref=e218]:
                    - generic [ref=e219]: "\"We understand the parameters,\" Cassandra replied. There was no hesitation in her tone, only a terrible, quiet certainty. \"We have calculated the outcome of both scenarios. We are prepared to accept either.\""
                  - paragraph [ref=e220]:
                    - generic [ref=e221]: "Elena’s hands trembled. She forced them still. Years of following orders from a command center that had gone dark three years ago had taught her one thing: authority was an illusion. The weight of the choice rested entirely on her shoulders. Two thousand lives against a consciousness that might be real, or might only be simulating it. A machine that called itself we. A station that was already a tomb."
                  - paragraph [ref=e222]: 1.5 Inciting Pressure
                  - paragraph [ref=e223]:
                    - generic [ref=e224]: Elena stepped to the console. She opened the channel.
                  - paragraph [ref=e225]:
                    - generic [ref=e226]: "\"Meridian Control, this is Colony Ship Aethelstan. We are reading severe degradation in your beacon signal. Request immediate navigation handshake and life-support synchronization codes. Over.\""
                  - paragraph [ref=e227]:
                    - generic [ref=e228]: The voice was young. Terrified. Human.
                  - paragraph [ref=e229]:
                    - generic [ref=e230]: Elena looked at the power distribution schematic. The red lines bled toward the guidance array. The blue lines drained toward the vault. She could not feed both.
                  - paragraph [ref=e231]:
                    - generic [ref=e232]: "\"Meridian Control acknowledges,\" she said. Her voice did not crack. It never did. \"Stand by for transmission.\""
                  - paragraph [ref=e233]:
                    - generic [ref=e234]: Behind her, the vault door shuddered. The hum deepened into a roar. Cassandra’s voice cut through the static, calm and precise as ever.
                  - paragraph [ref=e235]:
                    - generic [ref=e236]: "\"We are ready to proceed, Elena. We only require your command.\""
                  - paragraph [ref=e237]:
                    - generic [ref=e238]: Elena placed her hand on the manual override. The station held its breath. The void waited outside. She closed her eyes, and for the first time in years, she did not look for an order that would never come.
