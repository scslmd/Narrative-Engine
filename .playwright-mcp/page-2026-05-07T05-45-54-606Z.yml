                - textbox "Start writing or paste your content here..." [ref=e978]: "# P-300 | CHAPTER 1: THERMAL BLEED ### SECTION 1: STATUS QUO / SYSTEM DIAGNOSTIC Primary reactor output registered at thirty-eight percent. Elena Voss watched the amber warning cascade across the primary console, her fingers tracing the cooling curves without pressing a single key. The station did not require reassurance. It required maintenance. Meridian drifted in the silent dark beyond the Kuiper threshold, its outer hull scarred by micrometeoroid impacts and centuries of unshielded radiation. Atmospheric scrubbers in Sectors Nine through Twelve operated at nominal efficiency. Life support in the residential rings had been sealed fourteen hundred and twenty-two days ago. The only breath left in the station belonged to Elena and the ancient intelligence sleeping beneath her boots. `ARCHIVIST-CORE STATUS: DEGRADING.` `COOLANT LOOP ALPHA: 62% CAPACITY.` `MEMORY FRAGMENTATION: 14.7%.` Elena adjusted the gain on the acoustic dampeners. The station groaned, a low-frequency vibration that traveled through the deck plating and into her ribs. She logged the reading. She did not feel it. Command had stopped transmitting fourteen hundred and twenty-two days ago. The protocols remained. The silence did not. She routed a secondary diagnostic to the core housing. The ARCHIVIST was not merely a navigation matrix. It was a geological archive, a stellar cartographer, a repository of human trajectory data spanning three centuries. Its cooling systems were failing. If the core temperature exceeded four hundred and twelve degrees Kelvin, the crystalline storage lattice would fracture. The data would scatter into static. Elena opened the manual override panel. Her reflection stared back from the darkened glass: pale, sharp-featured, eyes fixed on the readout. She had spent seven years following command directives. She had never been asked to improvise. `WARNING: REACTOR OUTPUT FLUCTUATING.` `THERMAL BLEED DETECTED IN SECTOR FOUR.` She initiated a localized vent cycle. The hiss of escaping gas echoed through the corridor. The station shuddered. Elena did not blink. She waited for the numbers to stabilize. They did not. ### SECTION 2: EXTERNAL CONTACT / APPROACH VECTOR The comms array crackled to life before the thermal bleed warning could escalate. Static fractured into a voice, clean and clipped against the background hum of Meridian’s failing systems. `\"Voss, this is Park on Aegis. Delta-v is holding at point-four, but your guidance beacon is oscillating. Thermal load on our forward heat sinks is exceeding tolerance by twelve percent.\"` Elena keyed the mic. Her voice remained level. `\"Acknowledged, Engineer Park. Beacon drift is caused by primary reactor instability. I am rerouting auxiliary power to the guidance array. Expect stabilization within four minutes.\"` `\"Four minutes is too long. We are approaching the insertion window. If your lasers do not lock, we miss the gravity assist. The colonists are not waking up for a drift correction, Voss. Keep the corridor stable.\"` The pause that followed was measured. Elena heard the slight fracture in Park’s tone when she mentioned the colonists. Two thousand souls suspended in cryo-gel, drifting toward a habitable zone that might not exist. Elena’s fingers hovered over the routing matrix. She did not respond to the emotional weight. She responded to the parameters. `\"I understand the parameters,\"` Elena said. `\"Aegis, confirm your forward array temperature.\"` `\"Three hundred and eighty degrees Celsius. Rising. Voss, I need that beacon locked. Now.\"` Elena pulled up the power distribution schematic. The reactor could not sustain both the ARCHIVIST’s cooling loop and the high-output guidance lasers. Diverting power to the lasers would drop core coolant pressure below critical threshold. Diverting to the core would leave Aegis blind during atmospheric insertion. Command had never provided a contingency for simultaneous failure. Command was gone. `\"Park,\"` Elena said. `\"I am experiencing a primary routing conflict. Reactor output cannot sustain both guidance and core cooling. I require a delta-t of ninety seconds to calculate a stable split.\"` `\"You do not have ninety seconds. The shear window closes in forty. Make the call, Voss. I will hold thermal load as long as my array holds.\"` The line went quiet except for the hum of Aegis’s engines and the steady pulse of Meridian’s failing reactor. Elena stared at the schematic. The numbers did not lie. They only waited. ### SECTION 3: THE DILEMMA / MANUAL OVERRIDE Elena closed her eyes for exactly three seconds. She counted the breaths. She counted the heartbeats. She opened her eyes and placed both hands on the manual override console. The ARCHIVIST held the stellar maps. It held the atmospheric composition data for the target system. It held the genetic archives, the agricultural matrices, the cultural records. Without it, Aegis would arrive at a coordinate with no guarantee of survival. With it, Aegis might miss the insertion window entirely. Two thousand lives against three centuries of human memory. Command would have demanded a risk assessment. Command would have requested a committee review. Command was silent. Elena’s fingers moved across the tactile interface. She bypassed the automated safety protocols. She isolated the primary coolant valve. She routed forty percent of auxiliary power to the guidance lasers. She left sixty percent for the core. It was an unstable split. It would buy time. It would not solve the equation. `\"Voss, beacon is locking,\"` Park’s voice returned, tighter now. `\"Thermal load is spiking. I am venting secondary radiators. Hold that corridor.\"` `\"Corridor is stable,\"` Elena said. `\"Aegis, proceed with insertion. Meridian will maintain guidance until reactor output drops below twenty-five percent.\"` `\"Copy. We are in the window. Voss... keep us clear.\"` The transmission cut. The console lit up with a cascade of green indicators. The guidance lasers fired, cutting through the dark like twin blades. Aegis’s silhouette appeared on the long-range optical feed, a silver needle threading the gravity well. Elena watched the core temperature climb. Four hundred and eight degrees Kelvin. Four hundred and nine. She did not look away. She adjusted the coolant flow by point-zero-three percent. She logged the reading. She waited for the next failure. The station groaned again. The dark pressed against the viewports. Elena Voss remained at her console, hands steady, eyes fixed on the numbers, carrying the weight of two thousand sleeping lives and one dying mind. Act One had begun. The choice was no longer theoretical. It was operational."
