<!DOCTYPE html>

<style>
:root {
  --bg: #0d1117; --bg2: #161b22; --bg3: #21262d; --border: #30363d;
  --text: #e6edf3; --text2: #8b949e;
  --blue: #58a6ff; --green: #3fb950; --purple: #bc8cff;
  --orange: #d29922; --red: #f85149; --cyan: #39d2c0;
  --pink: #f778ba; --yellow: #e3b341;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
h1 { text-align: center; font-size: 1.5rem; margin-bottom: 6px; }
.subtitle { text-align: center; color: var(--text2); margin-bottom: 20px; font-size: 0.85rem; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 20px; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.75rem; color: var(--text2); }
.legend-dot { width: 10px; height: 10px; border-radius: 2px; }
.tabs { display: flex; gap: 4px; margin-bottom: 16px; justify-content: center; }
.tab { padding: 7px 18px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg3); cursor: pointer; font-size: 0.82rem; color: var(--text2); transition: all 0.15s; }
.tab:hover { border-color: var(--blue); }
.tab.active { background: var(--blue); color: #fff; border-color: var(--blue); }
.tab-content { display: none; }
.tab-content.active { display: block; }
.cy-container { width: 100%; height: 800px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg2); position: relative; }
.cy-container::after { content: 'Scroll to zoom · Drag to pan · Click node for details'; position: absolute; bottom: 8px; right: 12px; font-size: 0.7rem; color: var(--text2); opacity: 0.5; pointer-events: none; }
.layout-btn { position: absolute; top: 8px; right: 12px; padding: 5px 12px; border-radius: 5px; border: 1px solid var(--border); background: var(--bg3); cursor: pointer; font-size: 0.75rem; color: var(--text2); z-index: 10; transition: all 0.15s; }
.layout-btn:hover { border-color: var(--blue); color: var(--blue); }
#detail-panel { margin-top: 12px; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; display: none; }
#detail-panel h3 { font-size: 0.95rem; margin-bottom: 8px; }
#detail-panel p { font-size: 0.82rem; color: var(--text2); line-height: 1.5; }
#detail-panel .close-btn { float: right; cursor: pointer; color: var(--text2); font-size: 1.1rem; }
</style>
</head>
<body>

<h1>Narrative Engine - Module Access Flow</h1>
<p class="subtitle">Complete module dependency map across backend (FastAPI) and frontend (React + Vite)</p>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:var(--yellow)"></div>Frontend</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--blue)"></div>Entry Points</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--purple)"></div>API Routers</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div>Services</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--orange)"></div>Persistence</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div>Middleware</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--pink)"></div>Inference</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--cyan)"></div>Schemas</div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('overview')">Overview</div>
  <div class="tab" onclick="switchTab('backend')">Backend Flow</div>
  <div class="tab" onclick="switchTab('frontend')">Frontend Flow</div>
  <div class="tab" onclick="switchTab('full')">Full Dependency Graph</div>
</div>

<div id="tab-overview" class="tab-content active">

<div id="tab-backend" class="tab-content">

</div>
<div id="tab-frontend" class="tab-content">

<div id="tab-full" class="tab-content">

// ============ TAB SWITCHING ============
let currentTab = 'overview';
function switchTab(name) {
  currentTab = name;
  document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(e => e.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  event.target.classList.add('active');
  setTimeout(() => { const cy = window['cy-' + name]; if (cy && cy.resize) cy.resize(); }, 50);
}

// ============ LAYOUT TOGGLE ============
const layoutModes = {};
function toggleLayout(id) {
  const cy = window[id];
  if (!cy) return;
  const mode = layoutModes[id] || 'dagre';
  const next = mode === 'dagre' ? 'cose' : 'dagre';
  layoutModes[id] = next;
  const btn = cy.container().querySelector('.layout-btn');
  if (btn) btn.textContent = next === 'dagre' ? 'Switch Layout (Force-directed)' : 'Switch Layout (Hierarchical)';
  cy.layout({
    name: next,
    animate: true,
    animationDuration: 800,
    padding: 40,
    fit: true,
    nodeDimensionsIncludeLabels: true,
    avoidOverlap: true,
    avoidOverlapPadding: 20,
    idealEdgeLength: 80,
    nodeOverlap: true,
  }).run();
}

// ============ INIT CYTOSCAPE ============
function initCy(id, elements) {
  const cy = cytoscape({
    container: document.getElementById(id),
    elements: elements,
    style: cyStyle,
    minZoom: 0.2,
    maxZoom: 2,
    wheelSensitivity: 0.25,
    layout: {
      name: 'dagre',
      rankDir: 'TB',
      padding: 30,
      animate: true,
      animationDuration: 600,
      fit: true,
      nodeSep: 20,
      rankSep: 80,
      edgeSep: 10,
      nodeDimensionsIncludeLabels: true,
      avoidOverlap: true,
    },
  });

  // Click handler
  cy.on('tap', 'node', function(evt) {
    const d = this.data();
    const panel = document.getElementById('detail-panel');
    if (currentTab !== 'overview') return;
    panel.style.display = 'block';
    const incoming = this.incomers('edge').length;
    const outgoing = this.outgoers('edge').length;
    panel.innerHTML = `
      <span class="close-btn" onclick="this.parentElement.style.display='none'">&times;</span>
      <h3 style="color:${d.color}">${d.label}</h3>
      <p>${d.desc || 'No description.'}</p>
      <p style="margin-top:6px;"><strong>Incoming:</strong> ${incoming} &nbsp; <strong>Outgoing:</strong> ${outgoing}</p>
    `;
  });

  cy.on('tap', function(evt) {
    if (evt.target === this) {
      document.getElementById('detail-panel').style.display = 'none';
    }
  });

  // Hover highlight
  cy.on('mouseover', 'node', function() {
    this.incomers('edge').addClass('highlight');
    this.outgoers('edge').addClass('highlight');
  });
  cy.on('mouseout', 'node', function() {
    cy.$('.highlight').removeClass('highlight');
  });

  return cy;
}
